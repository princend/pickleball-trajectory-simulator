<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <!-- 確保手機端比例正確，並防止雙擊放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pickleball Trajectory Simulator</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <div id="ui-container">
      <div class="ui-header">
        <h2>Pickleball 物理軌跡</h2>
        <div class="header-actions">
          <!-- 💡 頂部操作列：收合面板時也能隨時揮拍與錄影！ -->
          <button id="playBtn">揮拍擊球</button>
          <button id="recordBtn">🎥 錄影</button>
          <button id="toggleUiBtn">收合</button>
        </div>
      </div>
      
      <div id="ui-content">
        <div class="control-group">
          <label for="shotPreset">快速預設 (Presets):</label>
          <select id="shotPreset">
            <option value="drop">Third Shot Drop (過渡落廚房區)</option>
            <option value="drive">Drive (平擊抽球)</option>
          </select>
        </div>
        
        <div class="control-group">
          <label for="spinType">旋轉 (Spin):</label>
          <select id="spinType">
            <option value="flat">平擊 (Flat)</option>
            <option value="topspin">上旋 (Topspin - 下墜加劇)</option>
          </select>
        </div>

        <div class="control-group">
          <label>發射仰角 (Angle): <span id="angleVal">25</span>°</label>
          <input type="range" id="angleSlider" min="1" max="45" step="0.5" value="25">
        </div>
        
        <div class="control-group">
          <label>初始力度 (Power): <span id="powerVal">11.3</span> m/s</label>
          <input type="range" id="powerSlider" min="5" max="30" step="0.1" value="11.3">
        </div>

        <div class="control-group">
          <label>擊球高度 (Height): <span id="heightVal">0.7</span> m</label>
          <input type="range" id="heightSlider" min="0.1" max="2.5" step="0.1" value="0.7">
        </div>

        <div id="status"></div>
      </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
